name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Codegen imports @ethos/db, which refuses to load without one. Nothing
      # here connects: the tests build their own in-memory database.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile: the server runs its TypeScript sources
          # directly under Node, so the runtime major is part of the contract.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run codegen

      # Formatting, lint and import order in one pass. `ci` differs from
      # `npm run check:biome` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npm run check:types

      # Server and db tests run Postgres in-process (PGlite) and the component
      # tests run in jsdom, so there is no service container here.
      - name: Test
        run: npm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # The tests push the schema from the models, so they cannot catch a
      # migration that fails on a real Postgres or one that was never generated.
      - name: Migrations apply
        run: npm run db:migrate

      # drizzle-kit writes nothing when the models and migrations agree.
      - name: Migrations match the models
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain db/drizzle)" ]; then
            git status --porcelain db/drizzle
            echo "::error::The models changed without a migration. Run npm run db:generate and commit db/drizzle."
            exit 1
          fi

  boot:
    runs-on: ubuntu-latest
    env:
      # Preflight refuses a short or published secret in production. CI-only, never deployed.
      JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Loaded into the local daemon under the tag docker-compose.yml runs, so
      # `up --no-build` starts the image this commit built.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vantreeseba/ethos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --wait blocks until every service's healthcheck passes, the app's included.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: /healthz answers
        run: curl -fsS http://127.0.0.1:3006/healthz

      - name: Logs
        if: failure()
        run: docker compose logs
